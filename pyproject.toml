[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sterling-exploration"
version = "0.1.0"
description = "Reproducible interpretability probes for Guide Labs Steerling-8B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "modal>=1.0,<2",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
concepts = [
  "pandas>=2,<3",
  "pyarrow>=17,<22",
]
model-inspection = [
  "accelerate>=1.2,<2",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sterling_exploration"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
